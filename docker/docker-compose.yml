name: cinehub

services:
  cine:
    image: mysql:8.4
    container_name: cinehub_cine
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cine_db
      MYSQL_USER: cris
      MYSQL_PASSWORD: cristian123
    ports:
      - "3308:3306"
    volumes:
      - ../../data/cine_data:/var/lib/mysql
      - ./cine-init:/docker-entrypoint-initdb.d:ro

  gestion:
    image: postgres:16
    container_name: cinehub_gestion
    environment:
      POSTGRES_DB: cine_db
      POSTGRES_USER: cris
      POSTGRES_PASSWORD: cristian123
    ports:
      - "5434:5432"
    volumes:
      - ../../data/gestion_data:/var/lib/postgresql/data
      - ./gestion-init:/docker-entrypoint-initdb.d:ro

  staging:
    image: postgres:16
    container_name: cinehub_staging
    environment:
        POSTGRES_DB: datawarehouse
        POSTGRES_USER: cris
        POSTGRES_PASSWORD: cristian123
    ports:
      - "5450:5432"
    volumes:
      - ../../data/datawarehouse_data:/var/lib/postgresql/data
      - ./datawarehouse-init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit
    container_name: cinehub_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: cinehub_adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - gestion
      - cine
      - staging

  rstudio:
    build:
      context: ./rstudio
    container_name: cinehub_rstudio
    environment:
      PASSWORD: rstudio123
      DW_HOST: staging
      DW_PORT: 5432
      DW_DATABASE: datawarehouse
      DW_USER: cris
      DW_PASSWORD: cristian123
    ports:
      - "8788:8787"
    volumes:
      - ./rstudio/proyecto:/home/rstudio/proyecto
    depends_on:
      - staging
    restart: unless-stopped

  python:
    build: ./python
    container_name: cinehub_python
    volumes:
      - ./python:/app
      - ./python/resultados:/app/resultados
    working_dir: /app
    depends_on:
      - staging
    command: sleep infinity
